; Appended to project.godot only in CI or a disposable validation checkout.
; Godot ignores override.cfg during --editor/--import, so apply these directly.
[application]

config/use_custom_user_dir=true
config/custom_user_dir_name="Farinuff Flight Smoke Tests"

[editor]

; Avoid Godot's concurrent font-import crash on an empty import cache:
; https://github.com/godotengine/godot/issues/111039
import/use_multiple_threads=false

[filesystem]

; Runtime scenes use the checked-in GLB exports. Editing sources need Blender,
; which is absent on GitHub runners and otherwise aborts the entire import batch.
import/blender/enabled=false

[display]

; The cursor is unnecessary headlessly and is not imported on the first boot.
mouse_cursor/custom_image=""
