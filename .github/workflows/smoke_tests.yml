name: Smoke Tests

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install verified pinned Godot editor
        run: python3 tools/install_release_engine.py --editor-dir "$RUNNER_TEMP/godot"

      - name: Check native resource contracts
        run: python3 tools/check_native_transition.py

      - name: Check native completion contract (file-only)
        run: python3 tests/check_native_completion.py

      - name: Check smoke runner failure handling
        run: python3 tests/test_smoke_runner.py

      - name: Check release package gate
        run: python3 tests/test_release_tools.py

      - name: Import project (refresh class cache)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-logs"
          cat tests/ci_settings.cfg >> project.godot
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/smoke-logs/import.log"
          # Godot can exit zero after aborting an import, leaving scenes unusable.
          if grep -Eq '(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/smoke-logs/import.log"; then
            echo "::error::Godot asset import failed; see import.log in the smoke-test-logs artifact."
            exit 1
          fi

      - name: Run smoke tests
        run: |
          python3 tools/run_smoke_tests.py \
            --godot godot \
            --log-dir "$RUNNER_TEMP/smoke-logs"

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
