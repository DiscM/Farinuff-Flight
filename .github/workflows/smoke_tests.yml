name: Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Godot 4.6.3 headless
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Check native resource contracts
        run: python3 tools/check_native_transition.py

      - name: Check native completion contract (file-only)
        run: python3 tests/check_native_completion.py

      - name: Check smoke runner failure handling
        run: python3 tests/test_smoke_runner.py

      - name: Import project (refresh class cache)
        timeout-minutes: 5
        run: |
          cat tests/ci_settings.cfg >> project.godot
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import

      - name: Run smoke tests
        run: |
          python3 tools/run_smoke_tests.py \
            --godot ./Godot_v4.6.3-stable_linux.x86_64 \
            --log-dir "$RUNNER_TEMP/smoke-logs"

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
