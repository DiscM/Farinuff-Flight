schema_version: 1
catalog: enemies
status: reference

generation_schedule:
  - generation: 1
    name: Standard
    waves: "1-5"
  - generation: 2
    name: Augmented
    waves: "6-10"
  - generation: 3
    name: Warform
    waves: "11-15"
  - generation: 4
    name: Apex
    waves: "16+"

generation_score_multipliers:
  gen_1: 1.0
  gen_2: 1.5
  gen_3: 2.25
  gen_4: 3.25

entries:
  - id: ENEMY.BASIC
    display_name: Basic Enemy
    role: foundational_pressure
    palette_role: scarlet_ember
    orb_value: 1
    orb_drop_chance: 0.60
    guaranteed_orb: false
    behavior: "Direct approach; later generations add charge, reactive movement, and a death fragment burst."
    tuning_status: reference
    generation_stats:
      gen_1: {max_health: 1, move_speed: 150.0, base_points: 100}
      gen_2: {max_health: 1, move_speed: 160.0, base_points: 100}
      gen_3: {max_health: 2, move_speed: 170.0, base_points: 100}
      gen_4: {max_health: 2, move_speed: 180.0, base_points: 100}

  - id: ENEMY.FAST
    display_name: Fast Enemy
    role: mobility_pressure
    palette_role: hot_orange
    orb_value: 1
    orb_drop_chance: 0.60
    guaranteed_orb: false
    behavior: "High-speed approach with perpendicular weaving; later generations add reactive sidesteps and a telegraphed phase move."
    tuning_status: reference
    generation_stats:
      gen_1: {max_health: 1, move_speed: 280.0, base_points: 150}
      gen_2: {max_health: 1, move_speed: 290.0, base_points: 150}
      gen_3: {max_health: 1, move_speed: 300.0, base_points: 150}
      gen_4: {max_health: 1, move_speed: 315.0, base_points: 150}

