    display_name: Tank Enemy
    role: durable_pressure
    palette_role: deep_violet
    orb_value: 3
    orb_drop_chance: 1.0
    guaranteed_orb: true
    behavior: "Slow armored approach with radial fire; later generations add plates, overload behavior, and additional hazards."
    tuning_status: reference
    generation_stats:
      gen_1: {max_health: 8, move_speed: 80.0, base_points: 300}
      gen_2: {max_health: 9, move_speed: 82.0, base_points: 300}
      gen_3: {max_health: 11, move_speed: 85.0, base_points: 300}
      gen_4: {max_health: 13, move_speed: 88.0, base_points: 300}

  - id: ENEMY.BOMBER
    display_name: Bomber Enemy
    role: hazard_pressure
    palette_role: toxic_lime
    orb_value: 2
    orb_drop_chance: 1.0
    guaranteed_orb: true
    behavior: "Drifting approach that drops mines; later generations add clusters and persistent plasma hazards."
    tuning_status: reference
    generation_stats:
      gen_1: {max_health: 1, move_speed: 60.0, base_points: 200}
      gen_2: {max_health: 2, move_speed: 65.0, base_points: 200}
      gen_3: {max_health: 2, move_speed: 70.0, base_points: 200}
      gen_4: {max_health: 3, move_speed: 75.0, base_points: 200}

  - id: ENEMY.SNIPER
    display_name: Sniper Enemy
    role: telegraph_pressure
    palette_role: cyan_warm_reactor
    orb_value: 2
    orb_drop_chance: 1.0
    guaranteed_orb: true
    behavior: "Enters, locks aim, telegraphs a high-speed shot, and withdraws; later generations add alternate shots and a rail beam."
    tuning_status: reference
    generation_stats:
      gen_1: {max_health: 2, move_speed: 145.0, base_points: 260}
