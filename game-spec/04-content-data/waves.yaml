schema_version: 1
catalog: waves
status: reference

campaign:
  first_wave: 1
  expedition_final_wave: 20
  endless_starts_after: 20
  boss_frequency: every_5th_wave
  elite_boss_waves: [10]
  allocation_frequency: after_every_5th_wave_clear
  allocation_points: 3

orb_target:
  base_formula: "floor(10 + wave_number * 1.30)"
  modifier: MOD.ENERGY_DROUGHT
  modifier_multiplier: 1.50
  surplus_rule: "Carry surplus to the next wave, capped at half the next wave target."

spawn_interval:
  base_formula: "max(1.55 - (wave_number - 1) * 0.045, 0.48)"
  modifier: MOD.RAPID_ASSAULT
  modifier_multiplier: 0.80

spawn_rules:
  spawn_margin_design_units: 80.0
  despawn_margin_design_units: 60.0
  edge_padding_design_units: 34.0
  player_safe_distance_design_units: 160.0
  max_spawn_rolls: 6

encounter_composition:
  notes: "Base weights before threat-budget rules or developer overrides."
  early_waves_1_to_2:
    ENEMY.BASIC: 0.75
    ENEMY.FAST: 0.25
  early_waves_3_to_5:
    ENEMY.BASIC: 0.34
    ENEMY.FAST: 0.24
    ENEMY.BOMBER: 0.18
    ENEMY.TANK: 0.14
    ENEMY.SNIPER: 0.10
  evolved_waves_6_plus:
    ENEMY.BASIC: 0.28
    ENEMY.FAST: 0.22
    ENEMY.BOMBER: 0.18
    ENEMY.TANK: 0.14
    ENEMY.SNIPER: 0.18

boss_rotation:
  regular_variants: [BOSS.ASSAULT_WING, BOSS.BULWARK_ARRAY, BOSS.TEMPEST_FORK]
  regular_rotation_starts_at_wave_5: true
  overrides:
    10: BOSS.VOID_HARBINGER
    20: BOSS.TEMPEST_CORE

generation_transitions:
  - after_wave: 5
    next_generation: 2
  - after_wave: 10
    next_generation: 3
  - after_wave: 15
    next_generation: 4

late_endless_drift:
  starts_after_wave: 16
  first_applies_at_wave: 17
  health_per_wave: 0.04
  health_cap: 2.0
  speed_per_wave: 0.015
  speed_cap: 1.30

first_clear_awards:
  5: 50
  10: 100
  15: 150
  20: 250
  25: 400
  30: 600
